<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="static/img/logo.png" alt="">
                  <span class="d-none d-lg-block " style="color: #ffffff;">Geo-Home</span>
                </a>
              </div>

              <div class=" mb-3">

                <div class="card-body">

                  <!-- Update the form action to point to the Flask route -->
                  <form class="row g-3 needs-validation" novalidate action="/login" method="POST">

                      <div class="col-12">
                          <label for="yourUsername" class="form-label">Username:</label>
                          <div class="input-group has-validation">
                              <span class="input-group-text" id="inputGroupPrepend">@</span>
                              <!-- Add the name attribute to the input field -->
                              <input type="text" name="username" class="form-control" id="yourUsername" required>
                              <div class="invalid-feedback">Please enter your username.</div>
                          </div>
                      </div>

                      <div class="col-12">
                          <label for="yourPassword" class="form-label">Password:</label>
                          <!-- Add the name attribute to the input field -->
                          <input type="password" name="password" class="form-control" id="yourPassword" required>
                          <div class="invalid-feedback">Please enter your password!</div>
                      </div>

                      <!-- Remove the CSRF token field, as it is not used without Flask-WTF -->
                      
                      <div class="col-12">
                          <button class="btn btn-success w-100" type="submit">Login</button>
                      </div>

                  </form>
                </div>
              </div>

            </div>
          </div>
        </div>

      </section>

    </div>
  </main>
